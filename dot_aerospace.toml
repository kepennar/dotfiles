start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

after-startup-command = [
  "layout tiles"
]

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]

# layout
alt-slash = "layout tiles horizontal vertical"
alt-comma = "layout accordion"

# focus
alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"

# move
alt-left = "move left"
alt-right = "move right"
alt-up = "move up"
alt-down = "move down"

# resize
alt-minus = "resize smart -50"
alt-equal = "resize smart +50"

# grouping / split-like behavior
alt-v = "join-with right"
alt-b = "join-with down"

# fullscreen
alt-f = "fullscreen"

# toggle orientation while staying tiled
alt-space = "layout tiles horizontal vertical"

# close window
alt-q = "close"

# workspaces
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"

# move window to workspace
alt-shift-1 = "move-node-to-workspace 1"
alt-shift-2 = "move-node-to-workspace 2"
alt-shift-3 = "move-node-to-workspace 3"
alt-shift-4 = "move-node-to-workspace 4"
