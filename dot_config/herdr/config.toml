onboarding = false

[theme]
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

[ui]
agent_panel_sort = "priority"
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true
tab_bar_right = [{ type = "datetime" }]
prompt_new_workspace_name = true
prompt_new_tab_name = false
mouse_capture = false

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.sidebar.agents]
row_gap = 1
# $model/$cost/$tests come from ~/.claude/hooks/herdr-sidebar.sh; unreported tokens and empty rows vanish.
rows = [
  ["state_icon", "agent", "$model", "state_text"],
  [{ token = "terminal_title_stripped", fg = "#89b4fa", bold = true }],
  ["workspace", "tab"],
  [
    { token = "$tests", fg = "#cdd6f4", rules = [
      { equals = "PASS", fg = "#a6e3a1", bold = true },
      { equals = "FAIL", fg = "#f38ba8", bold = true },
      { equals = "RUNNING", fg = "#f9e2af" },
    ] },
    "$cost",
  ],
]

[ui.toast]
delivery = "system"

[keys]
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
focus_agent = "prefix+alt+1..9"
last_pane = "prefix+tab"
cycle_pane_next = "prefix+]"

[experimental]
pane_history = true

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"
